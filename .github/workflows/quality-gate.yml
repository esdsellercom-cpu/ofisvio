# §76 — ZORUNLU KALİTE KAPISI
#
# Bu pipeline dört komutu çalıştırır: pint, phpstan, php artisan test, npm run build.
# Herhangi biri FAIL ise modül tamamlanmış sayılmaz (§76) ve merge edilmez.
#
# Testi geçirmek için test değiştirilemez veya gevşetilemez (§76). Bu yüzden
# iş akışı `continue-on-error` KULLANMAZ ve hiçbir adımda `|| true` yoktur.

name: Kalite Kapısı

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: pint · phpstan · test · build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo_sqlite, redis, zip, gd
          coverage: none

      - name: Composer bağımlılıkları
        run: composer install --no-interaction --prefer-dist --no-progress

      # Tedarik zinciri (audit F-16): lock dosyası tutarlı ve bilinen zafiyet yok; biri bile varsa kapı kırmızı.
      - name: Bağımlılık denetimi (composer)
        run: |
          composer validate --strict --no-check-publish
          composer audit --no-dev --format=summary

      - name: Ortam
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      # --- 1/4 ---
      - name: Pint (kod stili)
        run: ./vendor/bin/pint --test

      # --- 2/4 ---
      - name: PHPStan (statik analiz)
        run: ./vendor/bin/phpstan analyse --no-progress

      # --- 3/4 ---
      - name: Migration + seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate --force
          php artisan db:seed --class=RolePermissionSeeder --force
          php artisan db:seed --class=LocationSeeder --force
          php artisan db:seed --class=WebsiteSeeder --force
          php artisan db:seed --class=SiteBlockSeeder --force
          php artisan storage:link

      # DB env'i BİLEREK verilmez: phpunit.xml'in :memory: ayarı geçerli olsun (dışarıdan
      # gelen env phpunit <env>'i ezer; dosya DB'si RefreshDatabase ile boşalırdı).
      # CACHE_STORE=redis kasıtlı: throttle/önbellek gerçek sürücüde de test edilir.
      - name: Testler
        env:
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1
        # JUnit raporu → başarısız testler GitHub ek açıklaması olarak görünür (log oturumu gerekmez); çıkış kodu korunur.
        run: |
          set +e
          php artisan test --log-junit=storage/logs/junit.xml
          code=$?
          php tests/Support/junit-annotations.php storage/logs/junit.xml
          exit $code

      # Faz 11: süre/bellek/sorgu baseline'ı — kapı değil, karşılaştırma artefaktı.
      - name: Performans baseline
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1
        # Test adımı RefreshDatabase ile aynı dosya DB'sini boşaltır; ölçüm öncesi referans veri yeniden seed'lenir (idempotent).
        run: |
          php artisan db:seed --force
          php artisan ofisvio:perf-baseline --out=storage/app/perf/baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ github.sha }}
          path: storage/app/perf/baseline.json
          retention-days: 30
      # --- 4/4 ---
      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frontend derleme
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

  security:
    name: Güvenlik testleri (P0)
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite

      # P0 kapsamındaki testler ayrı bir job'da: gate yeşilse bile bunlar
      # kırmızıysa merge edilmez. Ayrılmalarının sebebi görünürlük —
      # "hangi test kırıldı" sorusunun cevabı iş akışı adından okunabilsin.
      - name: Tenant izolasyonu + RBAC + mimari
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate --force
          php artisan db:seed --class=RolePermissionSeeder --force
          php artisan test --testsuite=Architecture
          php artisan test --filter='TenantScopeTest|TenantContextTest|AuthorizationScopeTest|KycAccessTest|PermissionMatrixTest'

      - name: Sahte veri taraması
        run: |
          # §3 / §74: fake data üretimi yasak. Seeder'lar dışında
          # 'faker' ve 'dummy' kullanımı gözden geçirilmeli.
          ! grep -rn --include='*.php' -E '\b(fake\(\)|Faker\\)' app/ || \
            (echo "app/ içinde fake data üretimi bulundu — §3 ihlali" && exit 1)

  # Testler SQLite üzerinde koşar; üretim MySQL'dir ve bazı hatalar yalnız orada görünür
  # (ör. aynı tabloda ikinci NOT NULL TIMESTAMP kolonu: "1067 Invalid default value").
  # Bu iş, gerçek MySQL üzerinde kurulumun tamamını koşarak o sınıfı kapıya bağlar.
  mysql:
    name: MySQL kurulum provası (migrate + seed)
    runs-on: ubuntu-latest
    needs: gate

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ofisvio
          MYSQL_DATABASE: ofisvio
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pofisvio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo_mysql, zip, gd
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      # Üretimdeki katı kip: sıfır tarih ve geçersiz varsayılan kabul edilmez — hata CI'da çıksın, sunucuda değil.
      - name: MySQL katı kipi
        run: |
          mysql -h 127.0.0.1 -uroot -pofisvio -e \
            "SET GLOBAL sql_mode='STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';"

      - name: Migration + referans veri (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ofisvio
          DB_USERNAME: root
          DB_PASSWORD: ofisvio
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan migrate:fresh --force   # baştan kurulum da temiz geçmeli (kalıntı şema olmadan)
  # --- Audit F-02: sürüm artefaktı — kapı + güvenlik yeşilse main'den imzalı, özetli, kaynağı doğrulanabilir paket.
  # Deploy sunucuda deploy/deploy.sh ile: sha256 + (gh attestation verify) → bakım → migrate → doctor → smoke → up.
  release:
    name: Sürüm artefaktı (sha256 + provenance)
    needs: [gate, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo_sqlite, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Üretim bağımlılıkları ve derleme
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
          npm ci
          npm run build

      - name: Paket + manifest + sha256
        run: |
          set -euo pipefail
          BUILD="ofisvio-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          cat > RELEASE.json <<JSON
          {
            "name": "${BUILD}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "composer_lock_sha256": "$(sha256sum composer.lock | cut -d' ' -f1)",
            "package_lock_sha256": "$(sha256sum package-lock.json | cut -d' ' -f1)"
          }
          JSON
          # Arşiv ağaç DIŞINA yazılır (tar kendi çıktısını arşivlemeye çalışıp hata vermesin).
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./tests' --exclude='./storage/logs' --exclude='./storage/framework/cache' \
              --exclude='./storage/framework/sessions' --exclude='./storage/framework/views' --exclude='./.env' --exclude='./database/database.sqlite' \
              -czf "$OUT/${BUILD}.tar.gz" .
          cp RELEASE.json "$OUT/RELEASE.json"
          (cd "$OUT" && sha256sum "${BUILD}.tar.gz" > "${BUILD}.tar.gz.sha256" && cat "${BUILD}.tar.gz.sha256")
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          cat RELEASE.json

      - name: Provenance (SLSA attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.OUT }}/${{ env.BUILD }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD }}
          path: |
            ${{ env.OUT }}/${{ env.BUILD }}.tar.gz
            ${{ env.OUT }}/${{ env.BUILD }}.tar.gz.sha256
            ${{ env.OUT }}/RELEASE.json
          retention-days: 90
